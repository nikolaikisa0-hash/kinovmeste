# Бесплатный хостинг на Render: подключите репозиторий, Render прочитает этот файл
services:
  - type: web
    name: kinovmeste
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: python3 server.py
    envVars:
      - key: YOUTUBE_API_KEY  # Render попросит вставить ключ при создании
        sync: false
